<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: Arial, sans-serif;
        }

        .clock {
            background: #222;
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 0 30px #555;
        }

        #time {
            color: white;
            font-size: 60px;
            font-weight: bold;
            letter-spacing: 5px;
        }

        @media (max-width: 500px) {
            .clock {
                padding: 30px;
            }

            #time {
                font-size: 40px;
            }
        }
    </style>
</head>

<body>

<div class="clock">
    <div id="time">00:00:00</div>
</div>

<script>

    function updateClock() {

        const now = new Date();

        let hours = now.getHours();
        let minutes = now.getMinutes();
        let seconds = now.getSeconds();

        if (hours < 10) {
            hours = "0" + hours;
        }

        if (minutes < 10) {
            minutes = "0" + minutes;
        }

        if (seconds < 10) {
            seconds = "0" + seconds;
        }

        document.getElementById("time").textContent =
            hours + ":" + minutes + ":" + seconds;
    }

    updateClock();

    setInterval(updateClock, 1000);

</script>

</body>
</html>
