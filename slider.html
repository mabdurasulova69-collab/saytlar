<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            font-family: Arial, sans-serif;
        }

        .slider {
            width: 700px;
            height: 400px;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .slide {
            width: 100%;
            height: 100%;
            display: none;
        }

        .slide.active {
            display: block;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
        }

        .btn:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        .prev {
            left: 15px;
        }

        .next {
            right: 15px;
        }
    </style>
</head>
<body>

    <div class="slider">

        <div class="slide active">
            <img src="https://di-uploads-pod1.dealerinspire.com/mercedesbenzoftyler/uploads/2022/08/emanuel-turbuc-zHPqIoxgvU0-unsplash.jpg" alt="">
        </div>

        <div class="slide">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSAiMt8Pmsn9Y40WkRLfyENj5V8thO9r5rKfD9BRHcbbE2cRVfO9M9AlWNO&s=10" alt="">
        </div>

        <div class="slide">
            <img src="https://images.cdn.autocar.co.uk/sites/autocar.co.uk/files/styles/gallery_slide/public/01-mercedes-g500-g-wagen-2024-review-lead-driving-front.jpg?itok=o7z6UwrT" alt="">
        </div>

        <div class="slide">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTgOMsIcxpr8HIjBybHWHrajiUvSvMcnTrDdgWzlNLOXUGhjFXDuY7R5xmz&s=10" alt="">
        </div>

        <button class="btn prev" onclick="previousSlide()">❮</button>
        <button class="btn next" onclick="nextSlide()">❯</button>

    </div>

    <script>
        const slides = document.querySelectorAll(".slide");

        let currentSlide = 0;

        function showSlide(index) {
            slides.forEach(slide => {
                slide.classList.remove("active");
            });

            slides[index].classList.add("active");
        }

        function nextSlide() {
            currentSlide++;

            if (currentSlide >= slides.length) {
                currentSlide = 0;
            }

            showSlide(currentSlide);
        }

        function previousSlide() {
            currentSlide--;

            if (currentSlide < 0) {
                currentSlide = slides.length - 1;
            }

            showSlide(currentSlide);
        }

        setInterval(nextSlide, 3000);
    </script>

</body>
</html>
