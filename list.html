<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do list</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .todo {
            width: 500px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow:10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .form input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        .form button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            cursor: pointer;
        }

        .form button:hover {
            background: #5568d8;
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px;
            margin-bottom: 10px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .task span {
            cursor: pointer;
        }

        .completed span {
            text-decoration: line-through;
            color: #888;
        }

        .delete {
            border: none;
            background: #e74c3c;
            color: white;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        @media (max-width: 550px) {
            .todo {
                width: 90%;
            }

            .form {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="todo">

    <h1>To-Do List</h1>

    <div class="form">
        <input type="text" id="taskInput" placeholder="Vazifa kiriting...">
        <button id="addButton">Qo'shish</button>
    </div>

    <ul id="taskList"></ul>

</div>

<script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    const taskInput = document.getElementById("taskInput");
    const addButton = document.getElementById("addButton");
    const taskList = document.getElementById("taskList");

    function saveTasks() {
        localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function renderTasks() {
        taskList.innerHTML = "";

        tasks.forEach(function(task, index) {

            const li = document.createElement("li");

            if (task.completed) {
                li.classList.add("completed");
            }

            li.innerHTML = `
                <div class="task">
                    <input type="checkbox" ${task.completed ? "checked" : ""}>
                    <span>${task.text}</span>
                </div>

                <button class="delete">O'chirish</button>
            `;

            const checkbox = li.querySelector("input");
            const deleteButton = li.querySelector(".delete");

            checkbox.addEventListener("change", function() {
                tasks[index].completed = checkbox.checked;
                saveTasks();
                renderTasks();
            });

            deleteButton.addEventListener("click", function() {
                tasks.splice(index, 1);
                saveTasks();
                renderTasks();
            });

            taskList.appendChild(li);
        });
    }

    addButton.addEventListener("click", function() {

        const text = taskInput.value.trim();

        if (text === "") {
            alert("Vazifa kiriting!");
            return;
        }

        tasks.push({
            text: text,
            completed: false
        });

        saveTasks();

        taskInput.value = "";

        renderTasks();
    });

    taskInput.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            addButton.click();
        }
    });

    renderTasks();
</script>

</body>
</html>
